# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Flutter Linter, Test, Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'

jobs:     
  linter_test:
    name: Flutter linter + test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform: [android]

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '12.x'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Create .env file 
        run: |
          touch .env
          echo "${{ secrets.ANDROID_API_KEY }}" >> .env
          cat .env

      - name: Install packages
        run: flutter pub get
      
      - name: Linter
        run: flutter analyze
      
      - name: Test
        run: flutter test

  build:
    name: Build APK, AAB, IPA
    runs-on: ubuntu-latest
    needs: linter_test

    strategy:
      matrix:
        # platform: [android, ios]
        platform: [android]

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '12.x'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Create .env file 
        run: |
          touch .env
          echo "${{ secrets.ANDROID_API_KEY }}" >> .env
          echo "${{ secrets.WEB_API_KEY }}" >> .env
          echo "${{ secrets.IOS_API_KEY }}" >> .env
          cat .env

      - name: Build APK (Android)
        if: matrix.platform == 'android'
        run: flutter build apk --release

      - name: Build AAB (Android)
        if: matrix.platform == 'android'
        run: flutter build appbundle --release

      - name: Build IPA (iOS)
        if: matrix.platform == 'ios'
        env:
          CI: true
        run: |
          flutter build ios --release --no-codesign

      - name: Upload APK
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v3
        with:
          name: app-release.apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload AAB
        if: matrix.platform == 'android'
        uses: actions/upload-artifact@v3
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Upload IPA
        if: matrix.platform == 'ios'
        uses: actions/upload-artifact@v3
        with:
          name: Runner.app
          path: build/ios/iphoneos/Runner.app

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v3
        with:
          name: app-release.apk
          path: ./release

      - name: Download AAB Artifact
        uses: actions/download-artifact@v3
        with:
          name: app-release.aab
          path: ./release

      - name: Download IPA Artifact
        uses: actions/download-artifact@v3
        with:
          name: Runner.app
          path: ./release

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/app-release.apk
          asset_name: app-release.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload AAB to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/app-release.aab
          asset_name: app-release.aab
          asset_content_type: application/vnd.android.package-archive

      - name: Upload IPA to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/Runner.app
          asset_name: Runner.app
          asset_content_type: application/octet-stream