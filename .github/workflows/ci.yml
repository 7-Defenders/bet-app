# documentation.

name: Flutter Linter + Test

on:
  push:
    branches:
      - ci_test

jobs:     
  linter_test:
    name: Flutter linter + test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        platform: [android]

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '12.x'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Create .env file 
        run: |
          touch .env
          echo "${{ secrets.ANDROID_API_KEY }}" >> .env
          cat .env

      - name: Install packages
        run: flutter pub get
      
      - name: Linter
        run: flutter analyze
      
      - name: Test
        run: flutter test