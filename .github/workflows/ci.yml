# separate terms of service, privacy policy, and support
# documentation.

name: Flutter

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:     
  flutter_android:
    name: Flutter Android test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '12.x'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.1'
          channel: 'stable'
      - name: Create .env file 
        run: |
          touch .env
          echo "${{ secrets.ANDROID_API_KEY }}" >> .env
          echo "${{ secrets.WEB_API_KEY }}" >> .env
          echo "${{ secrets.IOS_API_KEY }}" >> .env
          cat .env
      - name: Install packages
        run: flutter pub get
      - name: Linter
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build apk
        run: flutter build apk
      - name: Build appbundle
        run: flutter build appbundle
      
  flutter_ios:
    name: Flutter iOS test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.13.1'
          channel: 'stable'
      - name: Create .env file 
        run: |
          touch .env
          echo "${{ secrets.ANDROID_API_KEY }}" >> .env
          echo "${{ secrets.WEB_API_KEY }}" >> .env
          echo "${{ secrets.IOS_API_KEY }}" >> .env
          cat .env
      - name: Install packages
        run: flutter pub get
      - name: Linter
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build
        run: flutter build ios --release --no-codesign
