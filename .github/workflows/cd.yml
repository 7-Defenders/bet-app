# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:     
  build-android:
    name: Build APK, AAB
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    strategy:
      matrix:
        platform: [android]

    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '12.x'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      - name: Create .env file 
        run: |
          touch .env
          echo "${{ secrets.ANDROID_API_KEY }}" >> .env
          echo "${{ secrets.IOS_API_KEY }}" >> .env
          cat .env

      - name: Build APK (Android)
        if: matrix.platform == 'android'
        run: flutter build apk --release

      - name: Build AAB (Android)
        if: matrix.platform == 'android'
        run: flutter build appbundle --release

      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-release.apk
          path: build/app/outputs/apk/release/app-release.apk

      - name: Upload AAB
        uses: actions/upload-artifact@v3
        with:
          name: app-release.aab
          path: build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: iOS Build
    runs-on: macos-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v3

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
      - run: flutter pub get

      - name: Create .env file 
        run: |
          touch .env
          echo "${{ secrets.IOS_API_KEY }}" >> .env
          cat .env
      
      - run: pod repo update
        working-directory: ios

      - run: flutter build ios --release --no-codesign

      - name: Show contents
        run: ls -al build/app/outputs/

      - name: Upload IPA
        uses: actions/upload-artifact@v3
        with:
          name: app-release.ipa
          path: build/app/outputs/ipa/release/app-release.ipa

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [build-android, build-ios]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Download APK Artifact
        uses: actions/download-artifact@v3
        with:
          name: app-release.apk
          path: ./release

      - name: Download AAB Artifact
        uses: actions/download-artifact@v3
        with:
          name: app-release.aab
          path: ./release
      
      - name: Show contents
        run: ls -al ./release

      - name: Download IPA Artifact
        uses: actions/download-artifact@v3
        with:
          name: app-release.ipa
          path: ./release

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: false

      - name: Upload APK to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/app-release.apk
          asset_name: app-release.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload AAB to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/app-release.aab
          asset_name: app-release.aab
          asset_content_type: application/vnd.android.package-archive

      - name: Upload IPA to Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./release/app-release.ipa
          asset_name: app-release.ipa
          asset_content_type: application/octet-stream